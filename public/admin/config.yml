# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
# Sveltia CMS — write and publish from the browser at /admin/
#
# Auth: GitHub OAuth, handled by functions/api/auth.ts + functions/api/callback.ts
# on Cloudflare Pages. Set these in Cloudflare → Pages → Settings → Environment
# variables (both encrypted): GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET.
# The GitHub OAuth app's callback URL must be https://aditirk.me/api/callback
#
# Local editing: `astro dev`, open http://127.0.0.1:4321/admin/, then
# “Work with Local Repository” and pick this project folder (no proxy server).

backend:
  name: github
  repo: aditirk1/aditis-website
  branch: main
  base_url: https://aditirk.me
  auth_endpoint: api/auth
  commit_messages:
    create: 'content: add {{collection}} "{{slug}}"'
    update: 'content: update {{collection}} "{{slug}}"'
    delete: 'content: remove {{collection}} "{{slug}}"'
    uploadMedia: 'content: upload {{path}}'
    deleteMedia: 'content: remove {{path}}'

media_folder: public/uploads
public_folder: /uploads

# Uploaded JPEG/PNG photos are re-encoded in the browser before they're
# committed: resized to fit 2048px and saved as WebP. Re-encoding drops EXIF
# (GPS location, camera serials) so it never reaches the public repo.
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2048
          height: 2048

# Keep frontmatter tidy for Astro content collections.
output:
  omit_empty_optional_fields: true

collections:
  # Single-file pages (homepage, services copy) — edit here, not in Astro.
  - name: pages
    label: Site pages
    files:
      - name: home
        label: Home page
        file: src/data/home.json
        fields:
          - { label: Hero title, name: hero_title, widget: string }
          - { label: Planet hint, name: planet_label, widget: string }
          - label: Rotating taglines
            name: taglines
            widget: list
            summary: '{{fields.item}}'
            hint: Shown one at a time as a rotating carousel (not all at once). Edit the list here to change the roles.
            field: { label: Tagline, name: item, widget: string }
          - { label: Hero description, name: hero_description, widget: text }
          - { label: Primary button label, name: cta_primary_label, widget: string }
          - { label: Primary button link, name: cta_primary_href, widget: string }
          - { label: Secondary button label, name: cta_secondary_label, widget: string }
          - { label: Secondary button link, name: cta_secondary_href, widget: string }
          - { label: About heading, name: about_heading, widget: string }
          - label: About paragraphs
            name: about_paragraphs
            widget: list
            field: { label: Paragraph, name: paragraph, widget: text }
          - { label: Resume link label, name: resume_label, widget: string }
          - { label: Resume link URL, name: resume_href, widget: string }
          - { label: Explore heading, name: explore_heading, widget: string }
          - label: Explore cards
            name: explore_cards
            widget: list
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Description, name: desc, widget: string }
              - { label: Link, name: href, widget: string }
      - name: services
        label: Services page
        file: src/data/services.json
        fields:
          - { label: Page title, name: page_title, widget: string }
          - { label: Intro, name: intro, widget: text }
          - label: Service offerings
            name: services
            widget: list
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Teaser, name: teaser, widget: text }
              - { label: Detail, name: detail, widget: text }
              - label: Includes
                name: includes
                widget: list
                field: { label: Item, name: item, widget: string }
          - { label: Process heading, name: process_heading, widget: string }
          - label: Process steps
            name: process
            widget: list
            fields:
              - { label: Step number, name: step, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Body, name: body, widget: text }
          - { label: CTA heading, name: cta_heading, widget: string }
          - { label: CTA body (contact form on), name: cta_body_contact, widget: text }
          - { label: CTA body (Stripe on), name: cta_body_stripe, widget: text }
          - { label: CTA body (LinkedIn only), name: cta_body_linkedin, widget: text }

  - name: projects
    label: Projects
    label_singular: project
    folder: src/content/projects
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
      - label: Tags
        name: tags
        widget: select
        multiple: true
        required: false
        options:
          - { label: Research, value: research }
          - { label: Engineering, value: engineering }
          - { label: Design, value: design }
      - { label: Summary, name: summary, widget: text }
      - { label: Thumbnail, name: thumbnail, widget: image, required: false, choose_url: true }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Body, name: body, widget: markdown }

  # Category = subfolder. `path` files each post under the category you pick, so
  # /blog groups it automatically. To add or rename a writing area, edit the
  # `options` list below — that is the only place categories are declared.
  - name: blog
    label: Blog
    label_singular: post
    folder: src/content/blog
    path: '{{category}}/{{slug}}'
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    sortable_fields: [date, title]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
      - label: Category
        name: category
        widget: select
        hint: Becomes the folder and the heading on /blog.
        default: essays
        options:
          - { label: Essays, value: essays }
          - { label: Notes, value: notes }
          - { label: Reading, value: reading }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Body, name: body, widget: markdown }

  - name: thoughts
    label: Thoughts
    label_singular: thought
    folder: src/content/thoughts
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    fields:
      - { label: Date, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Body, name: body, widget: markdown }

  # One entry per photo. Photos with the same album name are grouped on /photo-dump.
  - name: photos
    label: Photo dump
    label_singular: photo
    folder: src/content/photos
    create: true
    extension: yml
    format: yaml
    slug: 'photo-{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}'
    summary: '{{album}} — {{caption}}'
    sortable_fields: [date, album]
    fields:
      - label: Photo
        name: image
        widget: image
        media_folder: /public/uploads/photos
        public_folder: /uploads/photos
      - label: Album
        name: album
        widget: string
        default: Misc
        hint: Photos with the same album name appear together. A new name starts a new album.
      - { label: Caption, name: caption, widget: string, required: false }
      - label: Alt text
        name: alt
        widget: string
        required: false
        hint: What's in the photo, for screen readers. Falls back to the caption.
      - { label: Date, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false, required: false }

  - name: dreams
    label: Dream journal
    label_singular: dream
    folder: src/content/dreams
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    fields:
      - { label: Date, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
      - { label: Mood, name: mood, widget: string, required: false }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - label: Pop-out words (amber)
        name: highlight-words
        widget: list
        required: false
        summary: '{{fields.word}}'
        hint: Words that should pop in the default amber comic style. They must appear in the body text.
        field: { label: Word, name: word, widget: string }
      - label: Pop-out styles
        name: word-styles
        widget: list
        required: false
        summary: '{{fields.word}} → {{fields.style}}'
        hint: Per-word comic styles. Overrides the amber list when the same word appears in both.
        fields:
          - { label: Word, name: word, widget: string }
          - label: Style
            name: style
            widget: select
            default: amber
            options:
              - { label: Amber (default comic), value: amber }
              - { label: Violet, value: violet }
              - { label: Burst (extra pop), value: burst }
      - { label: Body, name: body, widget: markdown }
