<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex, nofollow" />
		<title>Edit site content · Decap CMS</title>
		<link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
		<style>
			html,
			body {
				margin: 0;
				min-height: 100%;
				font: 16px/1.5 system-ui, sans-serif;
				color: #111;
				background: #e8eef5;
			}
			#cms-status {
				max-width: 40rem;
				margin: 3rem auto;
				padding: 1.5rem;
				background: #fff;
				border: 1px solid #b8c4d4;
				border-radius: 4px;
			}
			#cms-status[data-ok='1'] {
				display: none;
			}
			code {
				font-size: 0.9em;
				background: #f3f3f3;
				padding: 0.1em 0.35em;
			}
		</style>
	</head>
	<body>
		<div id="cms-status">
			<p><strong>Loading the content editor…</strong></p>
			<p>Open <code>https://aditirk.me/admin/</code> (trailing slash). Hard-refresh with ⌘⇧R if this is stuck.</p>
			<p id="cms-detail" style="color: #555"></p>
		</div>
		<!-- Prefer same-origin bundle; CDN is fallback if the build omitted the file -->
		<script src="/admin/decap-cms.js"></script>
		<script>
			(function () {
				var status = document.getElementById('cms-status');
				var detail = document.getElementById('cms-detail');
				function markOk() {
					if (status) status.setAttribute('data-ok', '1');
				}
				function markFail(msg) {
					if (detail) detail.textContent = msg;
				}
				function cmsReady() {
					return Boolean(window.CMS || window.DecapCms);
				}

				if (cmsReady()) {
					markOk();
					return;
				}

				// Local script missing or failed — load from jsDelivr
				var cdn = document.createElement('script');
				cdn.src = 'https://cdn.jsdelivr.net/npm/decap-cms@3.15.1/dist/decap-cms.js';
				cdn.onload = function () {
					if (cmsReady()) markOk();
					else markFail('Decap script loaded but did not initialize. Check the browser console.');
				};
				cdn.onerror = function () {
					markFail(
						'Could not load Decap from this site or jsDelivr. Check Cloudflare deploy logs and that /admin/decap-cms.js returns 200.',
					);
				};
				document.body.appendChild(cdn);

				setTimeout(function () {
					if (cmsReady()) markOk();
					else if (status && status.getAttribute('data-ok') !== '1') {
						markFail(
							'Still blank after 10s — open Web Inspector → Console/Network and look for failed /admin/decap-cms.js or config.yml.',
						);
					}
				}, 10000);
			})();
		</script>
	</body>
</html>
